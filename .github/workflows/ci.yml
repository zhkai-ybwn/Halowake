name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend (lint & typecheck)
        run: npm run lint

      - name: Frontend unit tests
        run: npm run test:unit

      - name: Frontend production build
        run: npm run build

      - name: Verify Rust library tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Verify deterministic production search integration tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --test skill_registry_search
